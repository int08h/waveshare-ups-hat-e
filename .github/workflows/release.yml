name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload binaries to (e.g., 0.1.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # Raspberry Pi 3/4/5 (64-bit)
          - aarch64-unknown-linux-musl
          # Raspberry Pi 2/3/4 (32-bit)
          - armv7-unknown-linux-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Build the tagged source, including on manual re-uploads.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build examples
        run: cross build --release --examples --target ${{ matrix.target }}

      - name: Rename binaries
        run: |
          cp target/${{ matrix.target }}/release/examples/ups_monitor ups_monitor-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/examples/force_power_off force_power_off-${{ matrix.target }}

      - name: Generate checksums
        run: |
          sha256sum ups_monitor-${{ matrix.target }} > ups_monitor-${{ matrix.target }}.sha256
          sha256sum force_power_off-${{ matrix.target }} > force_power_off-${{ matrix.target }}.sha256

      # gh only uploads assets; it never edits the release itself. Editing a
      # release with GITHUB_TOKEN fails with a 403 when the tagged commit's
      # workflow files differ from the default branch.
      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "ups_monitor-$TARGET" \
            "ups_monitor-$TARGET.sha256" \
            "force_power_off-$TARGET" \
            "force_power_off-$TARGET.sha256"
